<style>
/* ===================== TOKENS ===================== */
:root{
  --ink:#16202E;
  --ink-soft:#52606D;
  --ink-faint:#8A95A1;
  --bg:#F6F5F1;
  --surface:#FFFFFF;
  --surface-2:#FBFAF7;
  --line:#E5E2DA;
  --line-strong:#D6D2C7;
  --brand:#2C4A52;
  --brand-deep:#1E353B;
  --brand-tint:#EAF0F0;
  --urgent:#A8392F;
  --urgent-tint:#F7E9E7;
  --soon:#9A6418;
  --soon-tint:#F6EEDF;
  --ok:#3F6B57;
  --ok-tint:#E8F0EC;
  --shadow:0 1px 2px rgba(22,32,46,.04), 0 8px 24px rgba(22,32,46,.06);
  --radius:10px;
  --radius-sm:7px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:"Inter",system-ui,sans-serif;
  background:var(--bg);
  color:var(--ink);
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px}
.mono{font-family:"JetBrains Mono",monospace}
.serif{font-family:"Newsreader",serif}

/* ===================== APP SHELL ===================== */
.app{display:grid;grid-template-columns:236px 1fr;height:100vh;overflow:hidden}

/* ---------- Sidebar ---------- */
.sidebar{
  background:var(--brand-deep);
  color:#D8E0E0;
  display:flex;flex-direction:column;
  padding:22px 16px;
}
.wordmark{display:flex;align-items:baseline;gap:9px;padding:4px 6px 22px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:16px}
.wordmark .badge{
  font-family:"JetBrains Mono",monospace;font-weight:600;font-size:13px;letter-spacing:.5px;
  background:#D8E0E0;color:var(--brand-deep);padding:3px 7px;border-radius:5px;
}
.wordmark .name{font-family:"Newsreader",serif;font-size:22px;font-weight:500;color:#fff;letter-spacing:.2px}
.nav{display:flex;flex-direction:column;gap:2px;flex:1}
.nav button{
  display:flex;align-items:center;gap:11px;width:100%;text-align:left;
  background:transparent;border:none;color:#AEBCBC;
  padding:10px 11px;border-radius:var(--radius-sm);font-size:14px;font-weight:500;
  transition:background .12s,color .12s;
}
.nav button .ico{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7}
.nav button .count{margin-left:auto;font-size:11px;font-weight:600;background:rgba(255,255,255,.1);color:#C7D2D2;padding:1px 7px;border-radius:20px;min-width:20px;text-align:center}
.nav button:hover{background:rgba(255,255,255,.06);color:#EAF0F0}
.nav button.active{background:var(--brand);color:#fff}
.nav button.active .count{background:rgba(255,255,255,.18);color:#fff}
.sidebar .foot{display:flex;flex-direction:column;gap:9px;padding-top:14px;border-top:1px solid rgba(255,255,255,.08)}
.sync-state{display:flex;align-items:center;gap:8px;font-size:11.5px;color:#9FB0B0;padding:0 6px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ink-faint);flex:none}
.dot.on{background:#79C9A6;box-shadow:0 0 0 3px rgba(121,201,166,.18)}
.dot.busy{background:#E0B65C;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.4}}
.btn-ghost-light{
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);color:#DCE4E4;
  padding:8px 11px;border-radius:var(--radius-sm);font-size:12.5px;font-weight:500;
  display:flex;align-items:center;gap:8px;justify-content:center;transition:background .12s;
}
.btn-ghost-light:hover{background:rgba(255,255,255,.13)}

/* ---------- Main ---------- */
.main{overflow-y:auto;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:5;background:rgba(246,245,241,.86);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);
  padding:18px 30px;display:flex;align-items:flex-end;justify-content:space-between;gap:20px;
}
.topbar .eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:1.3px;color:var(--ink-faint);font-weight:600;margin-bottom:3px}
.topbar h1{font-family:"Newsreader",serif;font-weight:500;font-size:27px;line-height:1.1;letter-spacing:.2px}
.topbar h1 .date-day{color:var(--brand)}
.btn-primary{
  background:var(--brand);color:#fff;border:none;padding:10px 16px;border-radius:var(--radius-sm);
  font-weight:600;font-size:13.5px;display:inline-flex;align-items:center;gap:8px;transition:background .12s,transform .06s;
}
.btn-primary:hover{background:var(--brand-deep)}
.btn-primary:active{transform:translateY(1px)}
.btn-primary .ico{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2}
.content{padding:24px 30px 60px;flex:1}

/* ---------- Resumen chips ---------- */
.summary{display:flex;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-bottom:24px}
.summary .cell{flex:1;padding:15px 20px;border-right:1px solid var(--line)}
.summary .cell:last-child{border-right:none}
.summary .cell .k{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--ink-faint);font-weight:600}
.summary .cell .v{font-family:"Newsreader",serif;font-size:30px;font-weight:500;line-height:1.1;margin-top:4px}
.summary .cell .v.alert{color:var(--urgent)}
.summary .cell .v.warn{color:var(--soon)}

/* ---------- Panel grid (Hoy) ---------- */
.panel-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.col-stack{display:flex;flex-direction:column;gap:20px}
.block{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.block > header{
  display:flex;align-items:center;gap:9px;padding:14px 18px;border-bottom:1px solid var(--line);
}
.block > header .label{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1px}
.block > header .tag{margin-left:auto;font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;background:var(--surface-2);color:var(--ink-faint);border:1px solid var(--line)}
.block > header .rail{width:8px;height:8px;border-radius:2px}
.rail.r-urgent,.tag.r-urgent{background:var(--urgent)}.tag.r-urgent{color:#fff;border:none}
.rail.r-soon,.tag.r-soon{background:var(--soon)}.tag.r-soon{color:#fff;border:none}
.rail.r-brand{background:var(--brand)}
.rail.r-ok{background:var(--ok)}
.block .body{padding:6px}
.empty{padding:26px 18px;text-align:center;color:var(--ink-faint);font-size:13px}
.empty .serif{display:block;font-size:16px;color:var(--ink-soft);margin-bottom:3px}

/* ---------- Task / event row ---------- */
.row{display:flex;align-items:flex-start;gap:11px;padding:11px 12px;border-radius:var(--radius-sm);transition:background .12s}
.row:hover{background:var(--surface-2)}
.row + .row{border-top:1px solid var(--line)}
.check{
  width:18px;height:18px;border:1.7px solid var(--line-strong);border-radius:5px;flex:none;margin-top:1px;
  background:var(--surface);display:flex;align-items:center;justify-content:center;transition:all .12s;
}
.check:hover{border-color:var(--brand)}
.check.done{background:var(--ok);border-color:var(--ok)}
.check svg{width:12px;height:12px;stroke:#fff;fill:none;stroke-width:2.5;opacity:0}
.check.done svg{opacity:1}
.row .main-txt{flex:1;min-width:0}
.row .title{font-weight:500;color:var(--ink);font-size:13.5px}
.row.is-done .title{text-decoration:line-through;color:var(--ink-faint)}
.row .meta{display:flex;align-items:center;gap:8px;margin-top:3px;font-size:12px;color:var(--ink-soft);flex-wrap:wrap}
.row .meta .cli{color:var(--brand);font-weight:600}
.row .meta .ref{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--ink-faint)}
.due{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:5px;white-space:nowrap}
.due.urgent{background:var(--urgent-tint);color:var(--urgent)}
.due.soon{background:var(--soon-tint);color:var(--soon)}
.due.normal{background:var(--brand-tint);color:var(--brand)}
.badge-estado{font-size:10.5px;font-weight:600;padding:1px 7px;border-radius:20px;margin-left:6px;vertical-align:1px;white-space:nowrap}
.badge-estado.ok{background:var(--ok-tint);color:var(--ok)}
.badge-estado.warn{background:var(--soon-tint);color:var(--soon)}
.badge-estado.due{background:var(--surface-2);color:var(--ink-soft)}
.time-chip{font-family:"JetBrains Mono",monospace;font-size:12px;font-weight:600;color:var(--brand);background:var(--brand-tint);padding:3px 8px;border-radius:5px;flex:none}
.pri{width:6px;align-self:stretch;border-radius:3px;flex:none}
.pri.alta{background:var(--urgent)}.pri.media{background:var(--soon)}.pri.baja{background:var(--line-strong)}
.row .acts{display:flex;gap:2px;opacity:0;transition:opacity .12s}
.row:hover .acts{opacity:1}
.icon-btn{background:transparent;border:none;width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--ink-faint)}
.icon-btn:hover{background:var(--line);color:var(--ink)}
.icon-btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8}

/* ---------- Type pill (agenda) ---------- */
.type-pill{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;padding:2px 7px;border-radius:4px}
.type-vista{background:#EDE6F3;color:#6B4E8C}
.type-plazo{background:var(--urgent-tint);color:var(--urgent)}
.type-reunion{background:var(--brand-tint);color:var(--brand)}
.type-llamada{background:var(--ok-tint);color:var(--ok)}
.type-otro{background:var(--surface-2);color:var(--ink-soft)}

/* ---------- Clientes ---------- */
.cli-layout{display:grid;grid-template-columns:300px 1fr;gap:20px;align-items:start}
.cli-list{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
.cli-search{padding:10px;border-bottom:1px solid var(--line)}
.cli-search input{width:100%;border:1px solid var(--line);border-radius:var(--radius-sm);padding:8px 11px;background:var(--surface-2);outline:none}
.cli-search input:focus{border-color:var(--brand);background:var(--surface)}
.cli-item{display:flex;align-items:center;gap:11px;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .12s}
.cli-item:hover{background:var(--surface-2)}
.cli-item.sel{background:var(--brand-tint)}
.avatar{width:34px;height:34px;border-radius:8px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;flex:none}
.cli-item .nm{font-weight:600;font-size:13.5px;line-height:1.2}
.cli-item .rf{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--ink-faint)}
.cli-item .badge-n{margin-left:auto;font-size:11px;font-weight:600;color:var(--urgent);background:var(--urgent-tint);padding:1px 7px;border-radius:20px}

.cli-detail{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);min-height:300px}
.cli-detail .head{padding:22px 24px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:16px}
.cli-detail .head .avatar{width:46px;height:46px;font-size:17px;border-radius:10px}
.cli-detail .head h2{font-family:"Newsreader",serif;font-weight:500;font-size:23px}
.cli-detail .head .sub{display:flex;gap:14px;flex-wrap:wrap;margin-top:5px;font-size:12.5px;color:var(--ink-soft)}
.cli-detail .head .sub a{color:var(--brand);text-decoration:none}
.cli-detail .head .sub a:hover{text-decoration:underline}
.cli-detail .head .ref-tag{font-family:"JetBrains Mono",monospace;font-size:11.5px;background:var(--surface-2);border:1px solid var(--line);padding:2px 8px;border-radius:5px;color:var(--ink-soft)}
.cli-detail .head .hacts{margin-left:auto;display:flex;gap:6px}
.notes-box{margin:16px 24px;padding:13px 15px;background:var(--soon-tint);border-radius:var(--radius-sm);font-size:13px;color:#5C4A22;border-left:3px solid var(--soon)}
.section-head{display:flex;align-items:center;gap:9px;padding:8px 24px;margin-top:8px}
.section-head .label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--ink-faint)}
.section-head .add{margin-left:auto;font-size:12px;color:var(--brand);font-weight:600;background:none;border:none;display:flex;align-items:center;gap:4px}
.proc-tabs{display:flex;gap:6px;flex-wrap:wrap;padding:12px 24px 4px;border-bottom:1px solid var(--line)}
.proc-tab{font-size:12.5px;font-weight:600;padding:6px 12px;border-radius:20px;border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);cursor:pointer;white-space:nowrap}
.proc-tab.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.proc-tab.add{color:var(--brand);border-style:dashed}
.proc-notes{margin:12px 24px 4px;padding:12px 14px;background:var(--soon-tint);border-radius:var(--radius-sm);border-left:3px solid var(--soon)}
.proc-notes-label{display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:#5C4A22;margin-bottom:6px}
.proc-notes-area{width:100%;min-height:70px;border:none;background:transparent;resize:vertical;font-family:inherit;font-size:13.5px;color:#5C4A22;line-height:1.5;outline:none}
.section-head .add:hover{text-decoration:underline}
.section-head .add svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2}
.cli-detail .listwrap{padding:0 14px 8px}

/* ---------- Tareas (tabla) ---------- */
.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.toolbar input[type=text]{flex:1;min-width:180px;border:1px solid var(--line);border-radius:var(--radius-sm);padding:9px 12px;background:var(--surface);outline:none}
.toolbar input[type=text]:focus{border-color:var(--brand)}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);overflow:hidden}
.seg button{background:transparent;border:none;padding:8px 13px;font-size:12.5px;font-weight:500;color:var(--ink-soft);border-right:1px solid var(--line)}
.seg button:last-child{border-right:none}
.seg button.on{background:var(--brand);color:#fff}
.table-wrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse}
thead th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.8px;color:var(--ink-faint);font-weight:700;padding:11px 16px;border-bottom:1px solid var(--line);background:var(--surface-2)}
tbody td{padding:12px 16px;border-bottom:1px solid var(--line);font-size:13.5px;vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--surface-2)}
tbody tr.done td .tt{text-decoration:line-through;color:var(--ink-faint)}
td .tt{font-weight:500}
td .cli-chip{color:var(--brand);font-weight:600;font-size:12.5px}
td .acts{display:flex;gap:2px;justify-content:flex-end}

/* ---------- Modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(22,32,46,.42);backdrop-filter:blur(2px);display:flex;align-items:flex-start;justify-content:center;padding:60px 20px;z-index:50;opacity:0;pointer-events:none;transition:opacity .15s}
.overlay.show{opacity:1;pointer-events:auto}
.modal{background:var(--surface);border-radius:14px;width:100%;max-width:520px;box-shadow:0 24px 60px rgba(22,32,46,.28);transform:translateY(-8px);transition:transform .18s}
.overlay.show .modal{transform:none}
.modal header{padding:20px 24px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.modal header h3{font-family:"Newsreader",serif;font-weight:500;font-size:20px}
.modal .body{padding:20px 24px;display:flex;flex-direction:column;gap:15px;max-height:64vh;overflow-y:auto}
.modal footer{padding:16px 24px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;align-items:center}
.field{display:flex;flex-direction:column;gap:6px}
.field.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field label{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--ink-soft)}
.field input,.field select,.field textarea{
  border:1px solid var(--line);border-radius:var(--radius-sm);padding:9px 12px;background:var(--surface);outline:none;color:var(--ink);
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-tint)}
.field textarea{resize:vertical;min-height:64px}
.btn-text{background:none;border:none;color:var(--ink-soft);font-weight:500;padding:9px 6px;font-size:13.5px}
.btn-text:hover{color:var(--ink)}
.btn-danger{background:none;border:none;color:var(--urgent);font-weight:600;font-size:13px;display:flex;align-items:center;gap:5px}
.btn-danger:hover{text-decoration:underline}
.btn-danger svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8}

/* ---------- Toast ---------- */
.toast-wrap{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:var(--ink);color:#fff;padding:11px 18px;border-radius:9px;font-size:13px;font-weight:500;box-shadow:0 10px 30px rgba(0,0,0,.2);display:flex;align-items:center;gap:9px;animation:rise .25s}
.toast.err{background:var(--urgent)}
.toast svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}

/* ---------- Config modal extras ---------- */
.cfg-note{font-size:12.5px;color:var(--ink-soft);background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius-sm);padding:12px 14px;line-height:1.55}
.cfg-note b{color:var(--ink)}
.cfg-note code{font-family:"JetBrains Mono",monospace;background:var(--brand-tint);padding:1px 5px;border-radius:4px;font-size:11.5px}
.cfg-row{display:flex;gap:10px;align-items:center}
.status-line{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:9px 12px;border-radius:var(--radius-sm);background:var(--surface-2);border:1px solid var(--line)}

/* ---------- Responsive ---------- */
@media(max-width:920px){
  .app{grid-template-columns:1fr}
  .sidebar{position:fixed;left:0;top:0;bottom:0;width:236px;transform:translateX(-100%);transition:transform .2s;z-index:40}
  .sidebar.open{transform:none}
  .menu-toggle{display:inline-flex!important}
  .panel-grid,.cli-layout{grid-template-columns:1fr}
  .summary{flex-wrap:wrap}.summary .cell{min-width:46%}
  .field.row2{grid-template-columns:1fr}
}
.menu-toggle{display:none;background:var(--surface);border:1px solid var(--line);width:38px;height:38px;border-radius:8px;align-items:center;justify-content:center}
.menu-toggle svg{width:20px;height:20px;stroke:var(--ink);fill:none;stroke-width:2}
.scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:35}
.scrim.show{display:block}

*:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===================== FACTURAS ===================== */
.fac-layout{display:grid;grid-template-columns:1fr 330px;gap:20px;align-items:start}
.fac-form{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px 24px}
.fac-sec{margin-bottom:22px}
.fac-sec .sec-t{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--ink-faint);border-bottom:1px solid var(--line);padding-bottom:7px;margin-bottom:14px}
.frow{display:grid;gap:12px;margin-bottom:12px}
.frow.two{grid-template-columns:1fr 1fr}.frow.one{grid-template-columns:1fr}
.ffield{display:flex;flex-direction:column;gap:5px;position:relative}
.ffield label{font-size:11.5px;font-weight:600;color:var(--ink-soft)}
.ffield input,.ffield textarea{border:1px solid var(--line);border-radius:var(--radius-sm);padding:9px 11px;background:var(--surface);outline:none;color:var(--ink)}
.ffield input:focus,.ffield textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-tint)}
.ffield input[readonly]{background:var(--surface-2);color:var(--ink-soft)}
.pctwrap{position:relative}.pctwrap input{padding-right:26px}
.pctbadge{position:absolute;right:11px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--ink-faint);pointer-events:none}
.hint{font-size:10.5px;color:var(--ink-faint);margin-top:2px}
.presets{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;align-items:center}
.presets .pl{font-size:11px;color:var(--ink-faint)}
.preset{font-size:11px;padding:4px 10px;border:1px solid var(--line);background:var(--surface-2);border-radius:20px;color:var(--ink-soft)}
.preset:hover{border-color:var(--brand);color:var(--brand)}
.ac{position:absolute;top:100%;left:0;right:0;background:var(--surface);border:1px solid var(--line-strong);border-top:none;border-radius:0 0 var(--radius-sm) var(--radius-sm);z-index:30;max-height:200px;overflow-y:auto;box-shadow:var(--shadow)}
.ac div{padding:9px 12px;cursor:pointer;border-bottom:1px solid var(--line)}
.ac div:hover{background:var(--brand-tint)}
.ac .acs{font-size:11px;color:var(--ink-faint);margin-top:1px}
.lines-h{display:grid;grid-template-columns:1fr 60px 90px 90px 26px;gap:8px;font-size:10px;font-weight:700;color:var(--ink-faint);text-transform:uppercase;padding-bottom:6px;border-bottom:1px solid var(--line);margin-bottom:8px}
.lrow{display:grid;grid-template-columns:1fr 60px 90px 90px 26px;gap:8px;margin-bottom:7px;align-items:center}
.lrow input{border:1px solid var(--line);border-radius:6px;padding:8px;background:var(--surface);outline:none;width:100%}
.lrow input:focus{border-color:var(--brand)}
.lrow input[type=number]{text-align:right}
.lamt{font-size:13px;text-align:right;font-weight:600;color:var(--ink)}
.lrm{background:none;border:none;cursor:pointer;color:var(--ink-faint);font-size:18px;line-height:1}
.lrm:hover{color:var(--urgent)}
.laddline{width:100%;background:none;border:1px dashed var(--line-strong);color:var(--ink-soft);font-size:12.5px;padding:9px;border-radius:var(--radius-sm);margin-top:4px}
.laddline:hover{border-color:var(--brand);color:var(--brand)}
.ftotals{margin-top:16px;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.ftrow{display:flex;justify-content:space-between;padding:9px 15px;font-size:13.5px;border-bottom:1px solid var(--line)}
.ftrow.hide{display:none}
.ftrow.grand{background:var(--brand-deep);color:#fff;font-weight:700;font-size:15px;border-bottom:none}
.ftrow .red{color:var(--urgent)}
.fgen{width:100%;margin-top:20px;background:var(--brand);color:#fff;border:none;padding:13px;font-size:14px;font-weight:700;border-radius:var(--radius-sm)}
.fgen:hover{background:var(--brand-deep)}.fgen:disabled{background:var(--ink-faint);cursor:not-allowed}
.fhist .fstats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.fac-filters{display:flex;gap:7px;margin-bottom:14px;flex-wrap:wrap}
.fac-filters select{font-size:12.5px;padding:6px 9px;border-radius:7px;border:1px solid var(--line);background:var(--surface);color:var(--ink);flex:1;min-width:0}
.fstat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);padding:11px 13px;text-align:center}
.fstat .v{font-family:"Newsreader",serif;font-size:21px;font-weight:500;color:var(--ink)}
.fstat .l{font-size:10px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.5px;margin-top:3px}
.invcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:9px;box-shadow:var(--shadow)}
.invcard .it{display:flex;justify-content:space-between;align-items:flex-start}
.invnum{font-family:"JetBrains Mono",monospace;font-size:12px;font-weight:600;color:var(--brand)}
.invcli{font-size:13px;font-weight:500;margin-top:2px}
.invmeta{font-size:11px;color:var(--ink-faint);margin-top:2px}
.invamt{font-family:"Newsreader",serif;font-size:16px;font-weight:500;text-align:right}
.invbase{font-size:10.5px;color:var(--ink-faint);text-align:right}
.invdrive{font-size:11px;margin-top:3px;text-align:right}.invdrive a{color:var(--brand);text-decoration:none}.invdrive a:hover{text-decoration:underline}
.invdel{margin-top:8px;font-size:11px;color:var(--ink-faint);background:none;border:1px solid var(--line);border-radius:5px;padding:3px 9px}
.invdel:hover{border-color:var(--urgent);color:var(--urgent)}
@media(max-width:920px){.fac-layout{grid-template-columns:1fr}}

/* ===================== CALENDARIO (semana / mes) ===================== */
.cal-bar{display:flex;align-items:center;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.cal-nav{display:flex;align-items:center;gap:4px}
.cal-nav button{width:32px;height:32px;border:1px solid var(--line);background:var(--surface);border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;color:var(--ink-soft)}
.cal-nav button:hover{border-color:var(--brand);color:var(--brand)}
.cal-nav button svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2}
.cal-today{padding:7px 13px;border:1px solid var(--line);background:var(--surface);border-radius:var(--radius-sm);font-size:12.5px;font-weight:600;color:var(--ink-soft)}
.cal-today:hover{border-color:var(--brand);color:var(--brand)}
.cal-period{font-family:"Newsreader",serif;font-size:20px;font-weight:500;text-transform:capitalize;color:var(--ink)}
.cal-spacer{flex:1}
.cal-import{font-size:12px;color:var(--brand);background:none;border:none;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.cal-import:hover{text-decoration:underline}
.cal-import svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8}

.cal-dow{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-bottom:6px}
.cal-dow span{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--ink-faint);text-align:center;padding:2px}
.cal-month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-auto-rows:minmax(94px,1fr);gap:6px}
.cal-cell{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);padding:6px 6px 4px;display:flex;flex-direction:column;gap:3px;min-height:94px;min-width:0;cursor:pointer;transition:border-color .12s}
.cal-cell:hover{border-color:var(--line-strong)}

.cal-cell.today{border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}
.cal-cell .dnum{font-size:12px;font-weight:600;color:var(--ink-soft);align-self:flex-start;width:22px;height:22px;display:flex;align-items:center;justify-content:center;border-radius:6px}
.cal-cell.today .dnum{background:var(--brand);color:#fff}
.cal-ev{font-size:11px;line-height:1.3;padding:2px 6px;border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--brand-tint);color:var(--brand);border-left:2px solid var(--brand)}

.cal-more{font-size:10.5px;color:var(--ink-faint);padding:1px 6px;font-weight:600}

.cal-week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}

<script>

/* Carpeta de Drive donde se archivan los PDF y el Excel de contabilidad */
/* Nota: "knownFolders" es solo una caché en memoria para no repetir búsquedas
   en Drive dentro de la misma sesión. NUNCA hardcodear aquí IDs de carpetas:
   la app siempre debe localizar/crear la carpeta del trimestre correcto

const DRIVE = { declaracionesId:"1pdDKNN8mD2v4GA1xkx6-10OpjwweNPRG", knownFolders:{} };

const YEAR = new Date().getFullYear();
const TABS = { clientes:"Clientes", tareas:"Tareas", agenda:"Agenda", facturas:"Facturas", procedimientos:"Procedimientos", trabajos:"PorFacturar", borrados:"Borrados" };
const HEADERS = {
  clientes:["id","nombre","referencia","nif","direccionFiscal","email","telefono","estado","notas","ivaDefecto","irpfDefecto","creado","mod","driveFolderUrl"],
  tareas:["id","clienteId","procedimientoId","titulo","detalle","prioridad","estado","vencimiento","creado","completadoEn","mod"],
  agenda:["id","clienteId","procedimientoId","titulo","tipo","fecha","hora","lugar","notas","gcalId","mod"],
  facturas:["seq","year","num","date","clienteId","procedimientoId","clientName","clientNif","concepto","base","iva","irpf","ivaPct","irpfPct","total","driveUrl","estado","cobrado"],
  procedimientos:["id","clienteId","titulo","estado","notas","creado","mod"],
  trabajos:["id","clienteId","procedimientoId","descripcion","importe","fecha","facturado","facturaRef","creado","mod"],
  borrados:["id","ts"]
};
const NUMFIELDS = { facturas:["seq","year","base","iva","irpf","ivaPct","irpfPct","total","cobrado"], clientes:["mod"], tareas:["mod"], agenda:["mod"], procedimientos:["mod"], trabajos:["importe","mod","facturado"], borrados:["ts"] };

/* ===================== ESTADO ===================== */
let state = { clientes:[], tareas:[], agenda:[], facturas:[], procedimientos:[], trabajos:[], borrados:[] };
let view = "hoy";
let selectedCliente = null;
let selectedProcedimiento = null; // null = "General" dentro de la ficha de cliente
let filters = { tareas:{ q:"", estado:"abiertas" }, facturas:{ clienteId:"", year:String(new Date().getFullYear()), estado:"" } };
let agendaView = "lista";        // lista | dia | semana | mes
let agendaRef = null;            // fecha de referencia (se fija en init)
let gAuth = { token:null, connected:false, email:"" };
let _dataSheetId = localStorage.getItem(DATA_SHEET_KEY) || null;
let syncTimer = null;

/* ===================== UTILIDADES ===================== */
const $ = s => document.querySelector(s);
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc = s => (s==null?"":String(s)).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const todayISO = () => { const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
function parseISO(s){ if(!s) return null; const [y,m,d]=String(s).split("-").map(Number); return new Date(y,m-1,d); }
function daysUntil(iso){ if(!iso) return null; const a=parseISO(todayISO()), b=parseISO(iso); return Math.round((b-a)/86400000); }
function fmtDateLong(d){ return d.toLocaleDateString("es-ES",{weekday:"long",day:"numeric",month:"long"}); }
function fmtDateShort(iso){ const d=parseISO(iso); if(!d) return ""; return d.toLocaleDateString("es-ES",{day:"numeric",month:"short"}); }
function dueClass(iso){ const n=daysUntil(iso); if(n===null) return null; if(n<0) return "urgent"; if(n<=2) return "soon"; return "normal"; }
function dueLabel(iso){ const n=daysUntil(iso); if(n===null) return ""; if(n<0) return `Vencida · ${fmtDateShort(iso)}`; if(n===0) return "Hoy"; if(n===1) return "Mañana"; if(n<=6) return `En ${n} días`; return fmtDateShort(iso); }
function initials(nm){ return (nm||"?").trim().split(/\s+/).slice(0,2).map(w=>w[0]).join("").toUpperCase(); }
function clienteById(id){ return state.clientes.find(c=>c.id===id); }
function clienteNombre(id){ const c=clienteById(id); return c?c.nombre:""; }
/* helpers de calendario */
function isoOf(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function addDaysISO(iso,n){ const d=parseISO(iso); d.setDate(d.getDate()+n); return isoOf(d); }
function addMonthsISO(iso,n){ const d=parseISO(iso); d.setMonth(d.getMonth()+n); return isoOf(d); }
function startOfWeekISO(iso){ const d=parseISO(iso); const wd=(d.getDay()+6)%7; d.setDate(d.getDate()-wd); return isoOf(d); } // lunes
function dayEntries(iso){
  const evs=state.agenda.filter(a=>a.fecha===iso).map(a=>({kind:"evento",ref:a,hora:a.hora||"",titulo:a.titulo,tipo:(a.tipo||"otro")}));
  const tas=state.tareas.filter(t=>t.estado!=="hecha"&&t.vencimiento===iso).map(t=>({kind:"tarea",ref:t,hora:"",titulo:t.titulo,tipo:"tarea"}));
  return [...evs,...tas].sort((a,b)=>(a.hora||"99").localeCompare(b.hora||"99"));
}
function openEntry(e){ if(e.kind==="tarea") editTask(e.ref.id); else editEvento(e.ref.id); }
function fmtN(n){ return (Number(n)||0).toFixed(2).replace(".",","); }
function fmtMoney(n){ return fmtN(n)+" €"; }

/* ===================== PERSISTENCIA LOCAL ===================== */
function saveLocal(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){} }
function loadLocal(){ try{ const r=localStorage.getItem(STORE_KEY); if(r){ const d=JSON.parse(r); state={clientes:d.clientes||[],tareas:d.tareas||[],agenda:d.agenda||[],facturas:d.facturas||[],procedimientos:d.procedimientos||[],trabajos:d.trabajos||[],borrados:d.borrados||[]}; } }catch(e){} }
function commit(){ saveLocal(); render(); scheduleSync(); }

/* ===================== AUTENTICACIÓN GOOGLE (Nivel 2: persistente + renovación silenciosa) =====================
   Usa Google Identity Services (GIS). El token se guarda en localStorage (no
   sessionStorage, que se borraba al cerrar la app) junto a su caducidad. Antes
   de darlo por caducado, la app intenta una renovación silenciosa en segundo
   plano (sin mostrar nada al usuario) aprovechando la sesión de Google activa
   en el navegador. Solo se pide "Conectar" a mano la primera vez, o si esa
   renovación silenciosa falla (p. ej. cerraste sesión de Google del todo). */
function gReady(){ return !!CONFIG.GOOGLE_CLIENT_ID; }
let tokenClient=null;
function initGis(){
  if(!(window.google&&google.accounts&&google.accounts.oauth2)){ setTimeout(initGis,300); return; }
  tokenClient=google.accounts.oauth2.initTokenClient({
    client_id:CONFIG.GOOGLE_CLIENT_ID, scope:SCOPE,
    callback:(resp)=>{
      if(resp&&resp.access_token){ saveToken(resp); verifyToken(); }
      else setSync("ready");
    },
    error_callback:()=>{ setSync("ready"); }
  });
}
function saveToken(resp){
  gAuth.token=resp.access_token;
  gAuth.expiresAt=Date.now()+(Number(resp.expires_in)||3500)*1000;
  localStorage.setItem(TOKEN_KEY, JSON.stringify({token:gAuth.token, expiresAt:gAuth.expiresAt}));
}
function connectGoogle(){
  if(!tokenClient){ toast("Cargando Google, prueba de nuevo en un segundo","err"); return; }
  tokenClient.requestAccessToken({prompt:"consent"});
}
/* Intenta renovar el token sin pedir nada al usuario. Devuelve true/false. */
function trySilentRenew(){
  return new Promise(resolve=>{
    if(!tokenClient){ resolve(false); return; }
    const prev=tokenClient.callback;
    tokenClient.callback=(resp)=>{
      tokenClient.callback=prev;
      if(resp&&resp.access_token){ saveToken(resp); resolve(true); }
      else resolve(false);
    };
    try{ tokenClient.requestAccessToken({prompt:""}); }catch(e){ tokenClient.callback=prev; resolve(false); }
  });
}
async function initAuth(){
  initGis();
  const raw=localStorage.getItem(TOKEN_KEY);
  if(raw){
    try{
      const {token,expiresAt}=JSON.parse(raw);
      if(token&&expiresAt>Date.now()+60000){ gAuth.token=token; gAuth.expiresAt=expiresAt; await verifyToken(); return; }
    }catch(e){}
  }
  // no hay token válido en local: probamos una renovación silenciosa antes de pedir conectar
  setSync("ready");
  setTimeout(async()=>{ if(await trySilentRenew()) verifyToken(); },500);
}
async function verifyToken(){
  try{
    const r=await fetch("https://www.googleapis.com/drive/v3/about?fields=user",{headers:{Authorization:"Bearer "+gAuth.token}});
    if(r.ok){ const d=await r.json(); gAuth.connected=true; gAuth.email=d.user?.emailAddress||""; setSync("ok"); pullData(true); }
    else { localStorage.removeItem(TOKEN_KEY); gAuth.token=null; gAuth.connected=false; setSync("ready"); }
  }catch(e){ setSync("error"); }
}
/* Renueva un poco antes de que caduque, para no pillarte a media acción. */
setInterval(()=>{ if(gAuth.connected&&gAuth.expiresAt&&gAuth.expiresAt-Date.now()<5*60000) trySilentRenew(); }, 60000);
async function api(url, opts={}){
  const r=await fetch(url,{ ...opts, headers:{ Authorization:"Bearer "+gAuth.token, "Content-Type":"application/json", ...(opts.headers||{}) } });
  if(r.status===401){
    if(await trySilentRenew()) return api(url, opts); // token renovado en silencio: reintenta una vez
    gAuth.connected=false; localStorage.removeItem(TOKEN_KEY); setSync("ready");
    throw new Error("401");
  }
  if(!r.ok) throw new Error("API "+r.status);
  return r.json();
}

/* ===================== HOJA DE DATOS (se crea sola en Drive) ===================== */
async function getOrCreateDataSheet(){
  if(_dataSheetId) return _dataSheetId;
  // buscar una hoja con ese nombre creada por la app
  const q=encodeURIComponent(`name='${DATA_SHEET_NAME}' and mimeType='application/vnd.google-apps.spreadsheet' and trashed=false`);
  const found=await api(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id)`);
  if(found.files&&found.files.length){ _dataSheetId=found.files[0].id; }
  else{
    const created=await api("https://sheets.googleapis.com/v4/spreadsheets",{method:"POST",body:JSON.stringify({
      properties:{title:DATA_SHEET_NAME},
      sheets:Object.values(TABS).map(t=>({properties:{title:t}}))
    })});
    _dataSheetId=created.spreadsheetId;
  }
  localStorage.setItem(DATA_SHEET_KEY,_dataSheetId);
  return _dataSheetId;
}
async function ensureTabs(sid){
  const meta=await api(`https://sheets.googleapis.com/v4/spreadsheets/${sid}`);
  const existing=(meta.sheets||[]).map(s=>s.properties.title);
  const missing=Object.values(TABS).filter(t=>!existing.includes(t));
  if(missing.length){
    await api(`https://sheets.googleapis.com/v4/spreadsheets/${sid}:batchUpdate`,{method:"POST",body:JSON.stringify({
      requests:missing.map(t=>({addSheet:{properties:{title:t}}}))
    })});
  }
}
function rowsFor(kind){ return [HEADERS[kind], ...state[kind].map(o=>HEADERS[kind].map(h=>o[h]==null?"":String(o[h])))]; }

/* ---- FUSIÓN (merge) sin pérdida de datos ----
   Cada registro lleva 'mod' (instante de última edición). Al fusionar dos
   versiones gana la más reciente; los borrados se registran como "tombstone"
   en la pestaña Borrados para que se propaguen sin resucitar lo eliminado. */
function recMod(o){ return Number(o&&o.mod)||0; }
function mergeById(localArr, remoteArr, tomb){
  const map={};
  [...(remoteArr||[]), ...(localArr||[])].forEach(o=>{ if(!o||!o.id) return; const ex=map[o.id]; if(!ex||recMod(o)>=recMod(ex)) map[o.id]=o; });
  if(tomb) Object.keys(tomb).forEach(id=>{ if(map[id]&&recMod(map[id])<=tomb[id]) delete map[id]; });
  return Object.values(map);
}
function facKey(f){ return Number(f.year)+"-"+Number(f.seq); }
function mergeFacturas(localArr, remoteArr, tomb){
  const map={};
  [...(remoteArr||[]), ...(localArr||[])].forEach(f=>{ if(f) map[facKey(f)]=f; });
  if(tomb) Object.keys(tomb).forEach(id=>{ if(id.indexOf("fac:")===0){ const k=id.slice(4); if(map[k]) delete map[k]; } });
  return Object.values(map);
}
function mergeDeleted(a,b){
  const m={};
  [...(a||[]), ...(b||[])].forEach(d=>{ if(!d||!d.id) return; const ts=Number(d.ts)||0; if(!m[d.id]||ts>m[d.id]) m[d.id]=ts; });
  return Object.keys(m).map(id=>({id,ts:m[id]}));
}
function mergeStates(local, remote, applyTomb){
  const borrados=mergeDeleted(local.borrados, remote.borrados);
  let tomb=null;
  if(applyTomb){ tomb={}; borrados.forEach(d=>{ tomb[d.id]=Number(d.ts)||0; }); }
  return {
    clientes:mergeById(local.clientes, remote.clientes, tomb),
    tareas:mergeById(local.tareas, remote.tareas, tomb),
    agenda:mergeById(local.agenda, remote.agenda, tomb),
    facturas:mergeFacturas(local.facturas, remote.facturas, tomb),
    procedimientos:mergeById(local.procedimientos, remote.procedimientos, tomb),
    trabajos:mergeById(local.trabajos, remote.trabajos, tomb),
    borrados
  };
}
function tombstone(id){ (state.borrados=state.borrados||[]).push({id,ts:Date.now()}); }
function stampMod(o){ o.mod=Date.now(); return o; }

async function readRemote(sid){
  const ranges=Object.values(TABS).map(t=>`ranges=${encodeURIComponent(t)}!A:Z`).join("&");
  const res=await api(`https://sheets.googleapis.com/v4/spreadsheets/${sid}/values:batchGet?${ranges}`);
  const got={clientes:[],tareas:[],agenda:[],facturas:[],procedimientos:[],trabajos:[],borrados:[]};
  (res.valueRanges||[]).forEach(vr=>{
    const tab=decodeURIComponent(vr.range.split("!")[0].replace(/'/g,""));
    const kind=Object.keys(TABS).find(k=>TABS[k]===tab); if(!kind) return;
    const [head,...rows]=vr.values||[[]];
    got[kind]=(rows||[]).filter(r=>r[0]!=null&&r[0]!=="").map(r=>{
      const o={}; (head||HEADERS[kind]).forEach((h,i)=>o[h]=r[i]??"");
      (NUMFIELDS[kind]||[]).forEach(f=>{ o[f]=Number(o[f])||0; });
      return o;
    });
  });
  return got;
}
async function writeRemote(sid){
  for(const kind of Object.keys(TABS)){
    await api(`https://sheets.googleapis.com/v4/spreadsheets/${sid}/values/${encodeURIComponent(TABS[kind])}!A:Z:clear`,{method:"POST",body:"{}"});
  }
  await api(`https://sheets.googleapis.com/v4/spreadsheets/${sid}/values:batchUpdate`,{method:"POST",body:JSON.stringify({
    valueInputOption:"RAW",
    data:Object.keys(TABS).map(kind=>({range:`${TABS[kind]}!A1`,values:rowsFor(kind)}))
  })});
}
/* reconcile: lee la nube, FUSIONA con lo local (nunca pisa), y reescribe el resultado */
async function reconcile(write, silent){
  if(!gAuth.connected) return;
  setSync("busy");
  try{
    const sid=await getOrCreateDataSheet(); await ensureTabs(sid);
    const remote=await readRemote(sid);
    state=mergeStates(state, remote, true);
    saveLocal(); render();
    if(write) await writeRemote(sid);
    setSync("ok");
    if(!silent) toast("Sincronizado con Google");
  }catch(e){ console.error(e); setSync("error"); if(!silent) toast("No se pudo sincronizar","err"); }
}
function pullData(silent){ return reconcile(true, silent); }
function scheduleSync(){
  if(!gAuth.connected) return;
  clearTimeout(syncTimer); setSync("busy");
  syncTimer=setTimeout(()=>reconcile(true,true),1500);
}
function setSync(s){
  const dot=$("#sync-dot"), txt=$("#sync-txt"); dot.className="dot";
  const map={
    local:["","Solo en este dispositivo"],
    ready:["","Conectar Google"],
    busy:["busy","Sincronizando…"],
    ok:["on", gAuth.email?("Google: "+gAuth.email):"Sincronizado con Google"],
    error:["","Error de conexión"]
  };
  const [cls,label]=map[s]||map.local;
  if(cls) dot.classList.add(cls);
  txt.textContent=label;
}

/* ===================== GOOGLE CALENDAR ===================== */
const CAL_TZ = "Europe/Madrid";
const CAL_BASE = "https://www.googleapis.com/calendar/v3/calendars/primary/events";
function pad2(n){ return String(n).padStart(2,"0"); }
function localRFC(d){ return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate())+"T"+pad2(d.getHours())+":"+pad2(d.getMinutes())+":00"; }
function nextDayISO(iso){ const d=parseISO(iso); d.setDate(d.getDate()+1); return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate()); }
function calTimes(ev){
  if(ev.hora){
    const startD=new Date(`${ev.fecha}T${ev.hora}:00`);
    const endD=new Date(startD.getTime()+60*60*1000);
    return { start:{dateTime:`${ev.fecha}T${ev.hora}:00`,timeZone:CAL_TZ}, end:{dateTime:localRFC(endD),timeZone:CAL_TZ} };
  }
  return { start:{date:ev.fecha}, end:{date:nextDayISO(ev.fecha)} };  // evento de día completo (plazos)
}
function calBody(ev){
  const cli=clienteById(ev.clienteId);
  const summary=(ev.tipo&&ev.tipo!=="Otro"?`[${ev.tipo}] `:"")+ev.titulo;
  const descParts=[]; if(cli) descParts.push("Cliente: "+cli.nombre+(cli.referencia?` (${cli.referencia})`:"")); if(ev.notas) descParts.push(ev.notas);
  return { summary, location:ev.lugar||"", description:descParts.join("\n"), ...calTimes(ev) };
}
async function upsertCalendarEvent(ev){
  if(!gAuth.connected) return;
  try{
    if(ev.gcalId){
      await api(`${CAL_BASE}/${encodeURIComponent(ev.gcalId)}`,{method:"PATCH",body:JSON.stringify(calBody(ev))});
    }else{
      const r=await api(CAL_BASE,{method:"POST",body:JSON.stringify(calBody(ev))});
      ev.gcalId=r.id; saveLocal();
    }
  }catch(e){ console.error("Calendar:",e); toast("Guardado, pero no se pudo sincronizar con Calendar","err"); }
}
async function deleteCalendarEvent(gcalId){
  if(!gAuth.connected||!gcalId) return;
  try{ await fetch(`${CAL_BASE}/${encodeURIComponent(gcalId)}`,{method:"DELETE",headers:{Authorization:"Bearer "+gAuth.token}}); }
  catch(e){ console.error("Calendar del:",e); }
}
async function importCalendar(){
  if(!gAuth.connected){ toast("Conecta Google primero","err"); return; }
  setSync("busy");
  try{
    const now=new Date(), max=new Date(now.getTime()+90*86400000);
    const url=`${CAL_BASE}?timeMin=${encodeURIComponent(now.toISOString())}&timeMax=${encodeURIComponent(max.toISOString())}&singleEvents=true&orderBy=startTime&maxResults=250`;
    const res=await api(url);
    let added=0;
    (res.items||[]).forEach(it=>{
      if(it.status==="cancelled"||!it.id) return;
      if(state.agenda.some(a=>a.gcalId===it.id)) return;
      const start=it.start||{};
      const fecha=(start.dateTime||start.date||"").slice(0,10);
      const hora=start.dateTime?start.dateTime.slice(11,16):"";
      if(!fecha) return;
      state.agenda.push(stampMod({ id:uid(), clienteId:"", titulo:it.summary||"(sin título)", tipo:"Otro", fecha, hora, lugar:it.location||"", notas:it.description||"", gcalId:it.id }));
      added++;
    });
    if(added){ commit(); toast(`${added} cita(s) importada(s) de Calendar`); }
    else { setSync("ok"); toast("No hay citas nuevas que importar"); }
  }catch(e){ console.error(e); setSync("error"); toast("No se pudo leer Google Calendar","err"); }
}

/* ---------- AGENDA ---------- */
const DOW=["Lun","Mar","Mié","Jue","Vie","Sáb","Dom"];
function renderAgenda(){
  if(!agendaRef) agendaRef=todayISO();
  let period="";
  if(agendaView==="dia"){ const d=parseISO(agendaRef); period=d.toLocaleDateString("es-ES",{weekday:"long",day:"numeric",month:"long"}); }
  else if(agendaView==="semana"){ const a=startOfWeekISO(agendaRef), b=addDaysISO(a,6); const da=parseISO(a),db=parseISO(b); period=`${da.getDate()} ${da.toLocaleDateString("es-ES",{month:"short"})} – ${db.getDate()} ${db.toLocaleDateString("es-ES",{month:"short"})}`; }
  else if(agendaView==="mes"){ period=parseISO(agendaRef).toLocaleDateString("es-ES",{month:"long",year:"numeric"}); }
  else period="Próximas citas";

  const seg=(v,l)=>`<button class="${agendaView===v?'on':''}" onclick="setAgendaView('${v}')">${l}</button>`;
  const nav = agendaView==="lista" ? "" :
    `<div class="cal-nav"><button onclick="agendaStep(-1)" aria-label="Anterior"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
      <button onclick="agendaStep(1)" aria-label="Siguiente"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button></div>
     <button class="cal-today" onclick="agendaToday()">Hoy</button>`;

  let bodyHtml="";
  if(agendaView==="mes") bodyHtml=monthHtml();
  else if(agendaView==="semana") bodyHtml=weekHtml();
  else if(agendaView==="dia") bodyHtml=dayHtml();
  else bodyHtml=listHtml();

  $("#content").innerHTML=`
    <div class="cal-bar">
      <div class="seg">${seg('dia','Día')}${seg('semana','Semana')}${seg('mes','Mes')}${seg('lista','Lista')}</div>
      ${nav}
      <div class="cal-period">${esc(period)}</div>
      <div class="cal-spacer"></div>
      <button class="cal-import" onclick="importCalendar()"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 9.5h17M8 3v4M16 3v4"/><path d="M12 12v5M9.5 14.5h5"/></svg>Importar de Calendar</button>
    </div>
    ${bodyHtml}`;
}
function setAgendaView(v){ agendaView=v; if(!agendaRef||v!=="lista") agendaRef=agendaRef||todayISO(); render(); }
function agendaToday(){ agendaRef=todayISO(); render(); }
function agendaStep(dir){
  if(agendaView==="dia") agendaRef=addDaysISO(agendaRef,dir);
  else if(agendaView==="semana") agendaRef=addDaysISO(agendaRef,7*dir);
  else if(agendaView==="mes") agendaRef=addMonthsISO(agendaRef,dir);
  render();
}

/* ---- LISTA (próximas + pasadas, como antes) ---- */
function listHtml(){
  const futuros=state.agenda.filter(a=>a.fecha>=todayISO()).sort((a,b)=>(a.fecha+(a.hora||"")).localeCompare(b.fecha+(b.hora||"")));
  const pasados=state.agenda.filter(a=>a.fecha<todayISO()).sort((a,b)=>(b.fecha+(b.hora||"")).localeCompare(a.fecha+(a.hora||"")));
  const groups={}; futuros.forEach(a=>{ (groups[a.fecha]=groups[a.fecha]||[]).push(a); });
  const dayBlocks=Object.keys(groups).sort().map(date=>{
    const d=parseISO(date),n=daysUntil(date); const rel=n===0?"Hoy":n===1?"Mañana":fmtDateLong(d);
    return `<div class="block" style="margin-bottom:16px"><header><span class="rail r-brand"></span><span class="label">${rel}</span><span class="tag">${fmtDateShort(date)}</span></header><div class="body">${groups[date].map(eventRow).join("")}</div></div>`;
  }).join("");
  return `${futuros.length?dayBlocks:`<div class="block"><div class="body">${emptyMsg("Agenda vacía","Añade vistas, plazos o reuniones con “Nuevo evento”, o impórtalas de tu Google Calendar.")}</div></div>`}
    ${pasados.length?`<div class="section-head" style="padding-left:0;margin-top:18px"><span class="label">Pasados</span></div><div class="block"><div class="body">${pasados.slice(0,15).map(eventRow).join("")}</div></div>`:""}`;
}

/* ---- DÍA ---- */
function dayHtml(){
  const items=dayEntries(agendaRef);
  return `<div class="block"><div class="body">${
    items.length ? items.map(e=>e.kind==="tarea"?taskRow(e.ref):eventRow(e.ref)).join("")
    : emptyMsg("Día despejado","Nada en la agenda para este día.")
  }</div></div>
  <button class="laddline" style="max-width:260px;margin-top:14px" onclick="newEventoOn('${agendaRef}')">+ Nuevo evento este día</button>`;
}

/* ---- SEMANA ---- */
function weekHtml(){
  const start=startOfWeekISO(agendaRef);
  let cols="";
  for(let i=0;i<7;i++){
    const iso=addDaysISO(start,i), d=parseISO(iso), isToday=iso===todayISO();
    const items=dayEntries(iso);
    cols+=`<div class="cal-col ${isToday?'today':''}">
      <div class="ch"><div class="d1">${DOW[i]}</div><div class="d2">${d.getDate()}</div></div>
      <div class="cbody">
        ${items.map(e=>`<div class="cal-wk-ev ${entryCls(e)}" onclick="${e.kind==='tarea'?`editTask('${e.ref.id}')`:`editEvento('${e.ref.id}')`}"><span class="wt">${esc(e.titulo)}</span>${e.hora?`<span class="wm">${esc(e.hora)}</span>`:e.kind==="tarea"?`<span class="wm">tarea</span>`:""}</div>`).join("")}
        <button class="cadd" onclick="newEventoOn('${iso}')">+</button>
      </div></div>`;
  }
  return `<div class="cal-week">${cols}</div>`;
}

/* ---- MES ---- */
function monthHtml(){
  const first=agendaRef.slice(0,8)+"01";
  const gridStart=startOfWeekISO(first);
  const refMonth=parseISO(agendaRef).getMonth();
  let cells="";
  for(let i=0;i<42;i++){
    const iso=addDaysISO(gridStart,i), d=parseISO(iso);
    const other=d.getMonth()!==refMonth, isToday=iso===todayISO();
    const items=dayEntries(iso);
    const shown=items.slice(0,3).map(e=>`<div class="cal-ev ${entryCls(e)}" onclick="event.stopPropagation();${e.kind==='tarea'?`editTask('${e.ref.id}')`:`editEvento('${e.ref.id}')`}">${e.hora?`<span class="tm">${esc(e.hora)}</span>`:""}${esc(e.titulo)}</div>`).join("");
    const more=items.length>3?`<div class="cal-more">+${items.length-3} más</div>`:"";
    cells+=`<div class="cal-cell ${other?'other':''} ${isToday?'today':''}" onclick="newEventoOn('${iso}')">
      <span class="dnum">${d.getDate()}</span>${shown}${more}</div>`;
  }
  return `<div class="cal-dow">${DOW.map(x=>`<span>${x}</span>`).join("")}</div><div class="cal-month">${cells}</div>`;
}
function entryCls(e){
  if(e.kind==="tarea") return "is-tarea";
  const t=(e.tipo||"otro").toLowerCase();
  return ["plazo","vista","llamada"].includes(t)?("t-"+t):"";
}
function newEventoOn(iso){ editEvento(null,"",iso); }

async function importarHistorico(){
  if(!confirm("Se importarán hasta "+HISTORICO_FACTURAS_2026.length+" facturas de 2026 al historial (las que ya existan con el mismo año y número se omiten). ¿Continuar?")) return;
  let nuevas=0, omitidas=0, clientesCreados=0;
  HISTORICO_FACTURAS_2026.forEach(h=>{
    if(state.facturas.some(f=>Number(f.year)===2026&&Number(f.seq)===h.seq)){ omitidas++; return; }
    let cli=state.clientes.find(c=>c.nombre.trim().toLowerCase()===h.cliente.trim().toLowerCase());
    if(!cli){ cli={id:uid(),nombre:h.cliente,referencia:"",nif:"",direccionFiscal:"",email:"",telefono:"",estado:"",notas:"",ivaDefecto:h.ivaPct,irpfDefecto:h.irpfPct,creado:h.date,mod:Date.now()}; state.clientes.push(cli); clientesCreados++; }
    state.facturas.push({seq:h.seq,year:2026,num:h.num,date:h.date,clienteId:cli.id,clientName:h.cliente,clientNif:"",concepto:h.concepto,base:h.base,iva:+(h.base*h.ivaPct/100).toFixed(2),irpf:h.irpf,ivaPct:h.ivaPct,irpfPct:h.irpfPct,total:h.total,driveUrl:null,estado:h.estado,cobrado:h.cobrado});
    nuevas++;
  });
  saveLocal(); render();
  if(gAuth.connected){
    try{ await reconcile(true,false); }
    catch(e){ console.error(e); toast(nuevas+" facturas importadas localmente, pero falló la sincronización con Google","err"); return; }
  }
  toast(nuevas+" facturas importadas"+(clientesCreados?" · "+clientesCreados+" clientes nuevos":"")+(omitidas?" · "+omitidas+" ya existían":""));
}

function getQuarter(dateStr){ const d=dateStr?new Date(dateStr+"T12:00:00"):new Date(); const m=d.getMonth()+1,y=d.getFullYear(); const q=m<=3?1:m<=6?2:m<=9?3:4; return {label:y+"-"+q+"T",year:y,q}; }
async function getOrCreateIngresosFolder(dateStr){
  const {label}=getQuarter(dateStr);
  if(DRIVE.knownFolders[label]) return DRIVE.knownFolders[label];
  let trimId=null;
  const st=await api(`https://www.googleapis.com/drive/v3/files?q=name='${label}' and mimeType='application/vnd.google-apps.folder' and '${DRIVE.declaracionesId}' in parents and trashed=false&fields=files(id)`);
  if(st.files&&st.files.length){ trimId=st.files[0].id; }
  else{ const c=await api("https://www.googleapis.com/drive/v3/files",{method:"POST",body:JSON.stringify({name:label,mimeType:"application/vnd.google-apps.folder",parents:[DRIVE.declaracionesId]})}); trimId=c.id; }
  let ingId=null;
  const si=await api(`https://www.googleapis.com/drive/v3/files?q=name='INGRESOS' and mimeType='application/vnd.google-apps.folder' and '${trimId}' in parents and trashed=false&fields=files(id)`);
  if(si.files&&si.files.length){ ingId=si.files[0].id; }
  else{ const c=await api("https://www.googleapis.com/drive/v3/files",{method:"POST",body:JSON.stringify({name:"INGRESOS",mimeType:"application/vnd.google-apps.folder",parents:[trimId]})}); ingId=c.id; }
  DRIVE.knownFolders[label]=ingId; return ingId;
}

/* ===================== CARPETA DE CLIENTE EN DRIVE =====================
   Sin acceso a Google Cloud Console no se puede usar el selector de Google
   (Picker), así que el enlace a la carpeta de cada cliente se pega a mano
   una vez en su ficha (campo "Carpeta de Drive"). El botón de la ficha
   simplemente abre ese enlace. */
function abrirCarpetaCliente(id){
  const cli=clienteById(id); if(!cli) return;
  if(cli.driveFolderUrl){ window.open(cli.driveFolderUrl,"_blank"); return; }
  toast("Este cliente no tiene carpeta de Drive vinculada todavía","err");

async function uploadToDrive(pdfBytes,filename,dateStr){
  if(!gAuth.connected) return null;
  try{
    const folderId=await getOrCreateIngresosFolder(dateStr);
    const boundary="gcg_"+Date.now();
    const meta={name:filename,mimeType:"application/pdf",parents:[folderId]};
    const enc=new TextEncoder();
    const p1=enc.encode("--"+boundary+"\r\nContent-Type: application/json\r\n\r\n"+JSON.stringify(meta)+"\r\n");
    const p2=enc.encode("--"+boundary+"\r\nContent-Type: application/pdf\r\n\r\n");
    const p3=enc.encode("\r\n--"+boundary+"--");
    const body=new Uint8Array(p1.length+p2.length+pdfBytes.length+p3.length);
    body.set(p1,0); body.set(p2,p1.length); body.set(pdfBytes,p1.length+p2.length); body.set(p3,p1.length+p2.length+pdfBytes.length);
    const r=await fetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,webViewLink",{method:"POST",headers:{Authorization:"Bearer "+gAuth.token,"Content-Type":"multipart/related; boundary="+boundary},body});
    if(!r.ok) throw new Error("Upload "+r.status);
    const res=await r.json(); return res.webViewLink||"https://drive.google.com/file/d/"+res.id+"/view";
  }catch(e){ console.error(e); return null; }
}

/* Localiza la fila de esta factura en el Excel de contabilidad (por número de
   factura, columna A) y actualiza solo COBRADO/PENDIENTE/ESTADO. Las
   facturas sin número (p.ej. "S/N") no se pueden localizar así, y hay que
   actualizarlas a mano en el Excel. */
async function syncCobroExcel(inv){
  const sid=await getOrCreateContaSheet();
  const col=await api(`https://sheets.googleapis.com/v4/spreadsheets/${sid}/values/Facturas!A2:A1000`);
  const rows=col.values||[];
  let rowIndex=-1;
  for(let i=0;i<rows.length;i++){ if(String((rows[i]||[])[0]||"").trim()===String(inv.seq)){ rowIndex=i+2; break; } }
  if(rowIndex<0) throw new Error("fila-no-encontrada");
  const pendiente=Math.max(0,+((Number(inv.total)||0)-(Number(inv.cobrado)||0)).toFixed(2));
  await contaWrite(sid, `Facturas!J${rowIndex}:L${rowIndex}`, [[inv.cobrado, pendiente, inv.estado]]);
}
async function registrarCobro(seq,year){
  const inv=state.facturas.find(f=>Number(f.seq)===Number(seq)&&Number(f.year)===Number(year));
  if(!inv) return;
  const pendiente=Math.max(0,(Number(inv.total)||0)-(Number(inv.cobrado)||0));
  const input=prompt("Importe cobrado ahora (€). Pendiente: "+fmtMoney(pendiente), fmtN(pendiente));
  if(input===null) return;
  const monto=parseFloat(String(input).replace(",","."));
  if(!(monto>0)){ toast("Importe no válido","err"); return; }
  inv.cobrado=+((Number(inv.cobrado)||0)+monto).toFixed(2);
  inv.estado = inv.cobrado >= (Number(inv.total)||0)-0.01 ? "Cobrada" : "Parcial";
  saveLocal(); render();
  if(gAuth.connected){
    try{ await syncCobroExcel(inv); await reconcile(true,false); }
    catch(e){
      console.error(e);
      const isSN=e&&e.message==="fila-no-encontrada";
      toast(isSN?"Cobro guardado en la app. Esta factura no tiene número, así que actualiza el Excel a mano":"Cobro guardado en la app, pero falló la sincronización con el Excel","err");
      return;
    }
  }
  toast("Cobro registrado"+(inv.estado==="Cobrada"?" · Factura marcada como Cobrada":""));
}
/* Trae a la app los cambios hechos a mano en el Excel de contabilidad
   (importe, cliente, concepto, fecha, IVA, retención, cobros). Solo actúa
   sobre facturas del año actual y con número (la de Julieta, "S/N", no se
   puede casar de forma fiable y hay que ajustarla a mano si hace falta).
   OJO: esto NO regenera el PDF ya emitido — solo actualiza el registro
   dentro de la app. Si la factura ya se envió al cliente, corregir aquí el
   importe/cliente/concepto no corrige el documento que él tiene. */
function parseSpanishDate(s){
  const m=String(s||"").trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if(!m) return null;
  return m[3]+"-"+String(m[2]).padStart(2,"0")+"-"+String(m[1]).padStart(2,"0");
}
function parseNum(s){
  let str=String(s??"").replace("%","").trim();
  if(!str) return 0;
  str=str.replace(/\./g,"").replace(",","."); // punto = miles, coma = decimal (formato español)
  return parseFloat(str)||0;
}
async function sincronizarDesdeExcel(){
  if(!gAuth.connected){ toast("Conecta Google primero","err"); return; }
  if(!confirm("Esto actualizará en la app los datos de las facturas de "+YEAR+" que hayas modificado a mano en el Excel de contabilidad (importe, cliente, concepto, fecha, IVA, retención, cobros).\n\nOJO: no modifica el PDF ya emitido, solo el registro dentro de la app.\n\n¿Continuar?")) return;
  try{
    const sid=await getOrCreateContaSheet();
    const res=await api(`https://sheets.googleapis.com/v4/spreadsheets/${sid}/values/Facturas!A2:L1000`);
    const rows=res.values||[];
    const numericRows=[], sinNumeroRows=[];
    rows.forEach(r=>{ const facNum=String(r[0]||"").trim(); if(!facNum) return; (/^\d+$/.test(facNum)?numericRows:sinNumeroRows).push(r); });
    const sinNumeroApp=state.facturas.filter(f=>Number(f.year)===YEAR && !/^\d+$/.test(String(f.num||"")));
    // Si hay exactamente una factura "sin número" en el Excel y exactamente una en la app
    // para este año, se emparejan con seguridad (aunque no tengan número que comparar).
    const pares=[];
    numericRows.forEach(r=>{
      const inv=state.facturas.find(f=>Number(f.seq)===Number(String(r[0]).trim())&&Number(f.year)===YEAR);
      if(inv) pares.push([r,inv]);
    });
    if(sinNumeroRows.length===1 && sinNumeroApp.length===1) pares.push([sinNumeroRows[0], sinNumeroApp[0]]);
    let actualizadas=0;
    pares.forEach(([r,inv])=>{
      let changed=false;
      const setIf=(field,val)=>{ if(val!==null && val!==undefined && String(inv[field])!==String(val)){ inv[field]=val; changed=true; } };
      const fecha=parseSpanishDate(r[1]); if(fecha) setIf("date",fecha);
      const nuevoNombre=(r[2]||inv.clientName||"").trim();
      if(nuevoNombre && nuevoNombre!==inv.clientName){
        const cli=clienteById(inv.clienteId);
        if(cli){ cli.nombre=nuevoNombre; stampMod(cli); } // propaga el nombre corregido al cliente vinculado
        setIf("clientName",nuevoNombre);
      }
      setIf("concepto",(r[3]||"").trim());
      setIf("base",parseNum(r[4]));
      setIf("ivaPct",parseNum(r[5]));
      setIf("irpfPct",parseNum(r[6]));
      setIf("irpf",parseNum(r[7]));
      setIf("total",parseNum(r[8]));
      setIf("cobrado",parseNum(r[9]));
      setIf("estado",(r[11]||inv.estado||"Pendiente").trim());
      if(changed) actualizadas++;
    });
    if(actualizadas){ saveLocal(); render(); await reconcile(true,false); toast(actualizadas+" factura(s) actualizadas desde el Excel"); }
    else toast("No había cambios que traer");
  }catch(e){ console.error(e); toast("No se pudo leer el Excel de contabilidad","err"); }
}

    let desc=l.desc||""; if(desc.length>60) desc=desc.substring(0,57)+"...";
    doc.text(desc,col.desc,y); doc.text(fmtN(qty),col.cant,y,{align:"right"}); doc.text(fmtN(price)+" €",col.cu,y,{align:"right"}); doc.text(fmtN(lb)+" €",col.total,y,{align:"right"}); y+=RH;
  });
  y+=12;
  const totRows=1+(ivaPct>0?1:0)+(irpfPct>0?1:0)+1, blockH=totRows*RH+8, blockTop=y, midX=110;
  doc.setFillColor(248,248,248); doc.setDrawColor(210,210,210); doc.setLineWidth(.3); doc.rect(L,blockTop,midX-L-4,blockH,"FD");
  doc.setFont("helvetica","bold"); doc.setFontSize(9); doc.setTextColor(40,40,40); doc.text("Forma de pago",L+4,blockTop+9);
  doc.setFont("helvetica","normal"); doc.setFontSize(9); doc.setTextColor(60,60,60); doc.text("Transferencia bancaria",L+4,blockTop+18); doc.text(EMISOR.iban,L+4,blockTop+26);
  const tx=midX+2,totW=R-tx; let ty=blockTop;
  function trow(lbl,val,bold,bg){ if(bg){doc.setFillColor(...bg);doc.rect(tx,ty,totW,RH,"F");} doc.setDrawColor(210,210,210); doc.rect(tx,ty,totW,RH,"S"); if(bold){doc.setFont("helvetica","bold");doc.setFontSize(10);}else{doc.setFont("helvetica","normal");doc.setFontSize(9);} doc.setTextColor(20,20,20); doc.text(lbl,tx+3,ty+6.5); doc.text(val,R-2,ty+6.5,{align:"right"}); ty+=RH; }
  trow("Base Imponible",fmtN(base)+" €",false,[248,248,248]);
  if(ivaPct>0) trow("IVA "+ivaPctDisp+" %","+"+fmtN(iva)+" €",false,[248,248,248]);
  if(irpfPct>0) trow("RETENCIÓN "+irpfPctDisp+" %","-"+fmtN(irpf)+" €",false,[248,248,248]);
  trow("Total",fmtN(total)+" €",true,[232,232,232]);
  y=blockTop+blockH+16;
  if(notes){ doc.setFont("helvetica","italic"); doc.setFontSize(8.5); doc.setTextColor(100,100,100); doc.text(doc.splitTextToSize(notes,CW),L,y); }
  doc.setDrawColor(180,180,180); doc.line(L,281,R,281);
  doc.setFont("helvetica","normal"); doc.setFontSize(7.5); doc.setTextColor(150,150,150);
  doc.text(EMISOR.nombre+" · Abogado · Colegiado ICAB nº "+EMISOR.icab,PW/2,287,{align:"center"});

  const filename="FACTURA - "+seq+" - "+clientName+".pdf";
  if(!gAuth.connected) doc.save(filename); // solo se descarga en local si NO hay Drive conectado (respaldo)
  const concepto=facLines.find(l=>l.desc)?.desc||"";

  // cliente en la cartera (actualiza o crea)
  let cli=facSel?clienteById(facSel):state.clientes.find(c=>c.nombre.toLowerCase()===clientName.toLowerCase());
  if(cli){ if(cNif)cli.nif=cNif; if(cEmail)cli.email=cEmail; if(cAddr)cli.direccionFiscal=cAddr; cli.ivaDefecto=ivaPctDisp; cli.irpfDefecto=irpfPctDisp; }
  else{ cli={id:uid(),nombre:clientName,referencia:"",nif:cNif,direccionFiscal:cAddr,email:cEmail,telefono:"",estado:"",notas:"",ivaDefecto:ivaPctDisp,irpfDefecto:irpfPctDisp,creado:todayISO()}; state.clientes.push(cli); }

  const invRecord={seq,year:YEAR,num,date:dateVal,clienteId:cli.id,procedimientoId:$("#fac-procedimiento")?$("#fac-procedimiento").value:"",clientName,clientNif:cNif,concepto,base,iva,irpf,ivaPct:ivaPctDisp,irpfPct:irpfPctDisp,total,driveUrl:null,estado:"Pendiente",cobrado:0};

  if(gAuth.connected){
    btn.textContent="Subiendo a Drive…";
    try{
      const url=await uploadToDrive(new Uint8Array(doc.output("arraybuffer")),filename,dateVal);
      invRecord.driveUrl=url||null;
      const {label}=getQuarter(dateVal);
      if(url) toast("Factura "+seq+" guardada en Drive · "+label+"/INGRESOS"); else toast("PDF descargado. No se pudo subir a Drive","err");
    }catch(e){ toast("PDF descargado. Error de Drive","err"); }
    btn.textContent="Actualizando contabilidad…";
    try{ await updateContabilidad(invRecord); }catch(e){ console.error("Conta:",e); }
  } else {
    toast("Factura "+seq+" descargada. Conecta Google para archivarla");
  }

  state.facturas.push(invRecord);
  if(facPendingTrabajos.length){
    const ref=YEAR+"-"+seq;
    state.trabajos.forEach(t=>{ if(facPendingTrabajos.includes(t.id)){ t.facturado=1; t.facturaRef=ref; stampMod(t); } });
    facPendingTrabajos=[];
  }
  // reset formulario
  facLines=[{desc:"",qty:1,price:""}]; facSel=null;
  ["fac-name","fac-nif","fac-email","fac-addr","fac-notes"].forEach(id=>{ const e=$("#"+id); if(e)e.value=""; });
  const facProcSel=$("#fac-procedimiento"); if(facProcSel) facProcSel.innerHTML=`<option value="">— General (sin procedimiento) —</option>`;
  $("#fac-iva").value=21; $("#fac-irpf").value=15;
  saveLocal(); render();     // guarda local y repinta historial al instante
  if(gAuth.connected){
    btn.textContent="Guardando historial…";
    clearTimeout(syncTimer);
    try{ await reconcile(true, true); }catch(e){ console.error("No se pudo guardar el historial:",e); toast("Factura generada, pero no se pudo guardar el historial en Google. Vuelve a intentarlo o revisa la conexión","err"); }
  } else {
    scheduleSync();
  }
  btn.disabled=false; btn.textContent="Generar factura";
  $("#fac-num").value=fmtNum(nextSeq());
  renderFacLines();
}

function renderFacStats(){
  const fy=filters.facturas.year;
  const yr=state.facturas.filter(i=>!fy||Number(i.year)===Number(fy));
  const base=yr.reduce((s,i)=>s+(Number(i.base)||0),0);
  const total=yr.reduce((s,i)=>s+(Number(i.total)||0),0);
  const el=$("#fac-stats"); if(!el) return;
  el.innerHTML=`
    <div class="fstat"><div class="v">${yr.length}</div><div class="l">Facturas ${fy||'(todos los años)'}</div></div>
    <div class="fstat"><div class="v">${fmtN(base)} €</div><div class="l">Base acumulada</div></div>
    <div class="fstat"><div class="v">${fmtN(total)} €</div><div class="l">Total facturado</div></div>
    <div class="fstat"><div class="v">${state.clientes.length}</div><div class="l">Clientes</div></div>
    <button class="btn-text" style="grid-column:1/-1;margin-top:4px" onclick="importarHistorico()">Importar facturas de 2026 previas al CRM</button>`;

function renderFacFilters(){
  const el=$("#fac-filters"); if(!el) return;
  const years=[...new Set(state.facturas.map(f=>Number(f.year)))].sort((a,b)=>b-a);

    <select onchange="filters.facturas.year=this.value;renderFacStats();renderFacHist()">
      <option value="">Todos los años</option>

      <option value="">Todos los clientes</option>
      ${state.clientes.slice().sort((a,b)=>a.nombre.localeCompare(b.nombre)).map(c=>`<option value="${c.id}" ${c.id===f.clienteId?'selected':''}>${esc(c.nombre)}</option>`).join("")}
    </select>

function renderFacHist(){
  const el=$("#fac-hist"); if(!el) return;
  const f=filters.facturas;
  let list=state.facturas.slice();
  if(f.year) list=list.filter(i=>Number(i.year)===Number(f.year));
  if(f.clienteId) list=list.filter(i=>i.clienteId===f.clienteId);
  if(f.estado) list=list.filter(i=>(i.estado||"Pendiente")===f.estado);
  list.sort((a,b)=> Number(b.year)-Number(a.year) || Number(b.seq)-Number(a.seq));
  if(!list.length){ el.innerHTML=`<div class="empty"><span class="serif">Sin facturas</span>Ajusta los filtros o genera una nueva.</div>`; return; }
  el.innerHTML=list.map(inv=>{
    const proc=inv.procedimientoId?state.procedimientos.find(p=>p.id===inv.procedimientoId):null;
    return `
    <div class="invcard">
      <div class="it">
        <div>
          <div class="invnum">Factura ${inv.num||fmtNum(inv.seq)} ${inv.estado?`<span class="badge-estado ${inv.estado==='Cobrada'?'ok':inv.estado==='Parcial'?'warn':'due'}">${esc(inv.estado)}</span>`:''}</div>

          <div class="invmeta">${inv.date?new Date(inv.date+"T12:00:00").toLocaleDateString("es-ES"):""} · IVA ${inv.ivaPct??21}% · Ret. ${inv.irpfPct??15}%</div>
        </div>
        <div>
          <div class="invamt">${fmtMoney(inv.total)}</div>
          <div class="invbase">Base ${fmtMoney(inv.base)}</div>
          ${inv.driveUrl?`<div class="invdrive"><a href="${esc(inv.driveUrl)}" target="_blank">Ver en Drive ↗</a></div>`:""}
        </div>
      </div>
      <div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap">
        ${inv.estado!=="Cobrada"?`<button class="btn-text" style="font-size:12px" onclick="registrarCobro(${inv.seq},${inv.year})">Registrar cobro</button>`:""}
        <button class="btn-text" style="font-size:12px" onclick="reasignarFacturaCliente(${inv.seq},${inv.year})">Asignar a cliente…</button>
        <button class="invdel" onclick="delFactura(${inv.seq},${inv.year})">Eliminar del historial</button>

}
function reasignarFacturaCliente(seq,year){
  const inv=state.facturas.find(f=>Number(f.seq)===Number(seq)&&Number(f.year)===Number(year));
  if(!inv) return;
  openModal(`<div class="modal"><header><h3>Asignar factura ${esc(inv.num||fmtNum(inv.seq))}</h3><button class="icon-btn" onclick="closeModal()"><svg viewBox="0 0 24 24" style="width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2"><path d="M6 6l12 12M18 6L6 18"/></svg></button></header>

function confirmarReasignacion(seq,year){
  const inv=state.facturas.find(f=>Number(f.seq)===Number(seq)&&Number(f.year)===Number(year));
  if(!inv) return;
  const nuevoNombre=$("#f-reasign-nuevo").value.trim();
  let cli;
  if(nuevoNombre){
    cli=state.clientes.find(c=>c.nombre.trim().toLowerCase()===nuevoNombre.toLowerCase());
    if(!cli){ cli=stampMod({id:uid(),nombre:nuevoNombre,referencia:"",nif:"",direccionFiscal:"",email:"",telefono:"",estado:"",notas:"",ivaDefecto:inv.ivaPct||21,irpfDefecto:inv.irpfPct||15,creado:todayISO()}); state.clientes.push(cli); }
  } else {
    cli=clienteById($("#f-reasign-cliente").value);
  }
  if(!cli){ toast("Elige un cliente de la lista o escribe uno nuevo","err"); return; }
  inv.clienteId=cli.id; inv.clientName=cli.nombre; if(cli.nif) inv.clientNif=cli.nif;
  inv.procedimientoId=""; // el procedimiento del cliente anterior no aplica al nuevo
  closeModal(); commit(); toast("Factura asignada a "+cli.nombre);
}
function delFactura(seq,year){
  if(!confirm("¿Eliminar esta factura del historial de la app? (No borra el PDF de Drive ni la fila de contabilidad.)")) return;
  state.facturas=state.facturas.filter(i=>!(Number(i.seq)===Number(seq)&&Number(i.year)===Number(year)));
  tombstone("fac:"+year+"-"+seq);
  commit(); $("#fac-num") && ($("#fac-num").value=fmtNum(nextSeq()));
}

function saveCliente(id){

    driveFolderUrl:$("#f-drive").value.trim(),
    nif:$("#f-nif").value.trim(), direccionFiscal:$("#f-dir").value.trim(),
    ivaDefecto:parseFloat($("#f-ivad").value)||0, irpfDefecto:parseFloat($("#f-irpfd").value)||0 };
  if(id){ Object.assign(clienteById(id),data); stampMod(clienteById(id)); }
  else { const c=stampMod({id:uid(),...data,creado:todayISO()}); state.clientes.push(c); selectedCliente=c.id; }

function delCliente(id){
  if(!confirm("¿Eliminar este cliente? Sus tareas, citas, procedimientos y trabajos pendientes de facturar quedarán sin asignar.")) return;
  state.clientes=state.clientes.filter(c=>c.id!==id); tombstone(id);
  state.tareas.forEach(t=>{ if(t.clienteId===id){ t.clienteId=""; t.procedimientoId=""; stampMod(t); } });
  state.agenda.forEach(a=>{ if(a.clienteId===id){ a.clienteId=""; a.procedimientoId=""; stampMod(a); } });
  state.procedimientos.filter(p=>p.clienteId===id).forEach(p=>tombstone(p.id));
  state.procedimientos=state.procedimientos.filter(p=>p.clienteId!==id);
  state.trabajos.filter(t=>t.clienteId===id).forEach(t=>tombstone(t.id));
  state.trabajos=state.trabajos.filter(t=>t.clienteId!==id);
  if(selectedCliente===id){ selectedCliente=state.clientes[0]?state.clientes[0].id:null; selectedProcedimiento=null; }
  closeModal(); commit(); toast("Cliente eliminado");
}
