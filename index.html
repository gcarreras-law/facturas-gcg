function newTrabajo(clienteId,procedimientoId){ editTrabajo(null,clienteId,procedimientoId); }
function editTrabajo(id,preCliente,preProcedimiento){
  const t=id?state.trabajos.find(x=>x.id===id):{clienteId:preCliente||selectedCliente||"",procedimientoId:preProcedimiento||"",fecha:todayISO()};
  openModal(`<div class="modal"><header><h3>${id?'Editar trabajo pendiente':'Nuevo trabajo pendiente de facturar'}</h3><button class="icon-btn" onclick="closeModal()"><svg viewBox="0 0 24 24" style="width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2"><path d="M6 6l12 12M18 6L6 18"/></svg></button></header>
    <div class="body">
      <input type="hidden" id="f-cliente-id" value="${esc(t.clienteId||'')}">
      <div class="field"><label>Descripción del trabajo</label><input id="f-desc" value="${esc(t.descripcion||'')}" placeholder="Redacción de contestación, reunión, gestión…"></div>
      <div class="field row2">
        <div class="field"><label>Importe estimado (€)</label><input id="f-importe" type="number" min="0" step="0.01" value="${t.importe??''}" placeholder="0,00"></div>
        <div class="field"><label>Fecha</label><input id="f-fecha" type="date" value="${esc(t.fecha||todayISO())}"></div>
      </div>
      <div class="field"><label>Procedimiento (opcional)</label><select id="f-procedimiento">${procedimientoOptions(t.clienteId,t.procedimientoId)}</select></div>
    </div>
    <footer>
      ${id?`<button class="btn-danger" onclick="delTrabajo('${id}')"><svg viewBox="0 0 24 24"><path d="M5 7h14M9 7V5h6v2M6 7l1 13h10l1-13"/></svg>Eliminar</button>`:`<span></span>`}
      <div style="display:flex;gap:8px"><button class="btn-text" onclick="closeModal()">Cancelar</button><button class="btn-primary" onclick="saveTrabajo('${id||''}')">Guardar</button></div>
    </footer></div>`);
}
function saveTrabajo(id){
  const descripcion=$("#f-desc").value.trim();
  if(!descripcion){ toast("Describe el trabajo realizado","err"); return; }
  const data={ descripcion, importe:parseFloat($("#f-importe").value)||0, fecha:$("#f-fecha").value||todayISO(), procedimientoId:$("#f-procedimiento").value };
  if(id){ Object.assign(state.trabajos.find(x=>x.id===id),data); stampMod(state.trabajos.find(x=>x.id===id)); }
  else{
    const clienteId=$("#f-cliente-id").value;
    state.trabajos.push(stampMod({id:uid(),clienteId,...data,facturado:0,facturaRef:"",creado:todayISO()}));
  }
  closeModal(); commit(); toast("Trabajo guardado");
}
function delTrabajo(id){ state.trabajos=state.trabajos.filter(t=>t.id!==id); tombstone(id); closeModal(); commit(); toast("Trabajo eliminado"); }
function facturarTrabajosPendientes(clienteId,procedimientoId){
  const items=state.trabajos.filter(t=>t.clienteId===clienteId && !t.facturado && (procedimientoId?t.procedimientoId===procedimientoId:!t.procedimientoId));
  if(!items.length) return;
  facPendingTrabajos=items.map(t=>t.id);
  facLines=items.map(t=>({desc:t.descripcion,qty:1,price:t.importe||0}));
  facSel=clienteId;
  facPreProcedimiento=procedimientoId||"";
  go("facturas");
  toast(items.length+" trabajo(s) cargados en la factura — revisa y genera");
}

/* TAREA */
function newTask(clienteId,procedimientoId){ editTask(null,clienteId,procedimientoId); }
function editTask(id,preCliente,preProcedimiento){
  const t=id?state.tareas.find(x=>x.id===id):{clienteId:preCliente||"",procedimientoId:preProcedimiento||""};
  openModal(`<div class="modal"><header><h3>${id?'Editar tarea':'Nueva tarea'}</h3><button class="icon-btn" onclick="closeModal()"><svg viewBox="0 0 24 24" style="width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2"><path d="M6 6l12 12M18 6L6 18"/></svg></button></header>
    <div class="body">
      <div class="field"><label>Tarea</label><input id="f-titulo" value="${esc(t.titulo||'')}" placeholder="Redactar contestación, llamar a…"></div>
      <div class="field row2">
        <div class="field"><label>Cliente</label><select id="f-cliente" onchange="refreshProcSelect()">${clienteOptions(t.clienteId)}</select></div>
        <div class="field"><label>Procedimiento</label><select id="f-procedimiento">${procedimientoOptions(t.clienteId,t.procedimientoId)}</select></div>
      </div>
      <div class="field row2">
        <div class="field"><label>Prioridad</label><select id="f-pri">
          <option value="baja" ${t.prioridad==='baja'?'selected':''}>Baja</option>
          <option value="media" ${t.prioridad==='media'?'selected':''}>Media</option>
          <option value="alta" ${t.prioridad==='alta'?'selected':''}>Alta</option></select></div>
        <div class="field"><label>Vencimiento</label><input id="f-venc" type="date" value="${esc(t.vencimiento||'')}"></div>
      </div>
      <div class="field"><label>Detalle</label><textarea id="f-detalle" placeholder="Notas, pasos, documentación…">${esc(t.detalle||'')}</textarea></div>
    </div>
    <footer>
      ${id?`<button class="btn-danger" onclick="delTask('${id}')"><svg viewBox="0 0 24 24"><path d="M5 7h14M9 7V5h6v2M6 7l1 13h10l1-13"/></svg>Eliminar</button>`:`<span></span>`}
      <div style="display:flex;gap:8px"><button class="btn-text" onclick="closeModal()">Cancelar</button><button class="btn-primary" onclick="saveTask('${id||''}')">Guardar</button></div>
    </footer></div>`);
}
function refreshProcSelect(){ const cid=$("#f-cliente").value; const sel=$("#f-procedimiento"); if(sel) sel.innerHTML=procedimientoOptions(cid,""); }
function saveTask(id){
  const titulo=$("#f-titulo").value.trim();
  if(!titulo){ toast("Escribe el título de la tarea","err"); return; }
  const data={ titulo, clienteId:$("#f-cliente").value, procedimientoId:$("#f-procedimiento").value, prioridad:$("#f-pri").value, vencimiento:$("#f-venc").value, detalle:$("#f-detalle").value.trim() };
  if(id){ Object.assign(state.tareas.find(x=>x.id===id),data); stampMod(state.tareas.find(x=>x.id===id)); }
  else { state.tareas.push(stampMod({id:uid(),...data,estado:"abierta",creado:todayISO(),completadoEn:""})); }
  closeModal(); commit(); toast("Tarea guardada");
}
function delTask(id){ state.tareas=state.tareas.filter(t=>t.id!==id); tombstone(id); closeModal(); commit(); toast("Tarea eliminada"); }

/* EVENTO */
function newEvento(clienteId,procedimientoId){ editEvento(null,clienteId,undefined,procedimientoId); }
function editEvento(id,preCliente,preFecha,preProcedimiento){
  const a=id?state.agenda.find(x=>x.id===id):{clienteId:preCliente||"",procedimientoId:preProcedimiento||"",fecha:preFecha||todayISO(),tipo:"Reunión"};
  const tipos=["Vista","Plazo","Reunión","Llamada","Otro"];
  const synced=!!a.gcalId;
  openModal(`<div class="modal"><header><h3>${id?'Editar evento':'Nuevo evento'}</h3><button class="icon-btn" onclick="closeModal()"><svg viewBox="0 0 24 24" style="width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2"><path d="M6 6l12 12M18 6L6 18"/></svg></button></header>
    <div class="body">
      <div class="field"><label>Título</label><input id="f-titulo" value="${esc(a.titulo||'')}" placeholder="Vista oral, vencimiento recurso…"></div>
      <div class="field row2">
        <div class="field"><label>Tipo</label><select id="f-tipo">${tipos.map(tp=>`<option ${a.tipo===tp?'selected':''}>${tp}</option>`).join("")}</select></div>
        <div class="field"><label>Cliente</label><select id="f-cliente" onchange="refreshProcSelect()">${clienteOptions(a.clienteId)}</select></div>
      </div>
      <div class="field"><label>Procedimiento</label><select id="f-procedimiento">${procedimientoOptions(a.clienteId,a.procedimientoId)}</select></div>
      <div class="field row2">
        <div class="field"><label>Fecha</label><input id="f-fecha" type="date" value="${esc(a.fecha||todayISO())}"></div>
        <div class="field"><label>Hora</label><input id="f-hora" type="time" value="${esc(a.hora||'')}"></div>
      </div>
      <div class="field"><label>Lugar</label><input id="f-lugar" value="${esc(a.lugar||'')}" placeholder="Juzgado, despacho, videollamada…"></div>
      <div class="field"><label>Notas</label><textarea id="f-notas" placeholder="Detalles, documentación a llevar…">${esc(a.notas||'')}</textarea></div>
      <label style="display:flex;align-items:center;gap:9px;font-size:13px;color:var(--ink-soft);cursor:pointer;margin-top:2px">
        <input type="checkbox" id="f-gcal" ${synced||!id?'checked':''} style="width:16px;height:16px;accent-color:var(--brand)">
        Añadir a mi Google Calendar${synced?' (ya sincronizado)':''}
      </label>
    </div>
    <footer>
      ${id?`<button class="btn-danger" onclick="delEvento('${id}')"><svg viewBox="0 0 24 24"><path d="M5 7h14M9 7V5h6v2M6 7l1 13h10l1-13"/></svg>Eliminar</button>`:`<span></span>`}
      <div style="display:flex;gap:8px"><button class="btn-text" onclick="closeModal()">Cancelar</button><button class="btn-primary" onclick="saveEvento('${id||''}')">Guardar</button></div>
    </footer></div>`);
}
async function saveEvento(id){
  const titulo=$("#f-titulo").value.trim();
  if(!titulo){ toast("Escribe el título del evento","err"); return; }
  const data={ titulo, tipo:$("#f-tipo").value, clienteId:$("#f-cliente").value, procedimientoId:$("#f-procedimiento").value, fecha:$("#f-fecha").value, hora:$("#f-hora").value, lugar:$("#f-lugar").value.trim(), notas:$("#f-notas").value.trim() };
  if(!data.fecha){ toast("Indica la fecha","err"); return; }
  const wantCal=$("#f-gcal").checked;
  let ev;
  if(id){ ev=state.agenda.find(x=>x.id===id); Object.assign(ev,data); }
  else { ev={id:uid(),...data,gcalId:""}; state.agenda.push(ev); }
  stampMod(ev);
  closeModal(); commit(); toast("Evento guardado");
  if(gAuth.connected){
    if(wantCal){ await upsertCalendarEvent(ev); }
    else if(ev.gcalId){ await deleteCalendarEvent(ev.gcalId); ev.gcalId=""; stampMod(ev); saveLocal(); commit(); }
  }
}
async function delEvento(id){
  const ev=state.agenda.find(a=>a.id===id);
  const gid=ev&&ev.gcalId;
  state.agenda=state.agenda.filter(a=>a.id!==id); tombstone(id);
  closeModal(); commit(); toast("Evento eliminado");
  if(gid) await deleteCalendarEvent(gid);
}

/* ---------- Config / conexión ---------- */

  const conn=gAuth.connected;
  openModal(`<div class="modal"><header><h3>Conexión y datos</h3><button class="icon-btn" onclick="closeModal()"><svg viewBox="0 0 24 24" style="width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2"><path d="M6 6l12 12M18 6L6 18"/></svg></button></header>
    <div class="body">
      <div class="status-line"><span class="dot ${conn?'on':''}"></span>${conn?('Conectado · '+esc(gAuth.email||'Google')):'Trabajando solo en este dispositivo'}</div>
      <div class="cfg-row">
        <button class="btn-primary" style="flex:1;justify-content:center" onclick="connectGoogle()">${conn?'Reconectar con Google':'Conectar con Google'}</button>
        ${conn?`<button class="btn-text" style="border:1px solid var(--line);border-radius:7px;padding:9px 14px" onclick="pullData()">Cargar de Google</button>`:""}
      </div>
      <div class="cfg-note">
        <b>Cómo funciona.</b> Tus datos (clientes, tareas, agenda y facturas) se guardan al instante en este equipo. Al conectar Google, se sincronizan con una hoja llamada <b>"${esc(DATA_SHEET_NAME)}"</b> que la app crea sola en tu Drive. Los eventos de la agenda se crean también en tu <b>Google Calendar</b>; las facturas generan el PDF en tu carpeta de INGRESOS y la fila en tu Excel de contabilidad. Al abrir desde otro dispositivo, pulsa <b>Cargar de Google</b> para traer lo último.
      </div>
      <div class="cfg-note">
        <b>Excel de contabilidad.</b> La app solo <i>escribe</i> ahí (facturas nuevas y cobros); no se sincroniza solo. Si editas algo a mano en ese Excel (importe, cliente, concepto, fecha, cobros...), usa el botón de abajo para traer esos cambios a la app cuando quieras.
      </div>
      <div class="cfg-row">
        <button class="btn-text" style="border:1px solid var(--line);border-radius:7px;padding:9px 14px;flex:1" onclick="sincronizarDesdeExcel()">Traer cambios del Excel de contabilidad</button>
      </div>
      <div class="cfg-row">
        <button class="btn-text" style="border:1px solid var(--line);border-radius:7px;padding:9px 14px;flex:1" onclick="exportJSON()">Exportar copia (.json)</button>
        <button class="btn-text" style="border:1px solid var(--line);border-radius:7px;padding:9px 14px;flex:1" onclick="document.getElementById('imp').click()">Importar copia</button>
        <input type="file" id="imp" accept="application/json" style="display:none" onchange="importJSON(this)">
      </div>
    </div>
    <footer><span style="font-size:12px;color:var(--ink-faint)">${esc(CONFIG.TITULAR)}</span><button class="btn-primary" onclick="closeModal()">Cerrar</button></footer>
  </div>`);
}
function exportJSON(){
  const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="despacho-copia-"+todayISO()+".json"; a.click();
}
function importJSON(input){
  const file=input.files[0]; if(!file)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      const incoming={clientes:d.clientes||[],tareas:d.tareas||[],agenda:d.agenda||[],facturas:d.facturas||[],procedimientos:d.procedimientos||[],trabajos:d.trabajos||[],borrados:d.borrados||[]};
      const nC=incoming.clientes.length, nT=incoming.tareas.length, nA=incoming.agenda.length;
      const replace=confirm(`La copia contiene ${nC} clientes, ${nT} tareas y ${nA} citas.\n\nAceptar = FUSIONAR (recomendado): se añade y actualiza sin borrar nada de lo que ya tienes.\nCancelar = volver sin importar.`);
      if(!replace) return;
      // fusión aditiva: nunca elimina registros existentes
      state={
        clientes:mergeById(state.clientes, incoming.clientes, null),
        tareas:mergeById(state.tareas, incoming.tareas, null),
        agenda:mergeById(state.agenda, incoming.agenda, null),
        facturas:mergeFacturas(state.facturas, incoming.facturas, null),
        procedimientos:mergeById(state.procedimientos, incoming.procedimientos, null),
        trabajos:mergeById(state.trabajos, incoming.trabajos, null),
        borrados:mergeDeleted(state.borrados, incoming.borrados)
      };
      closeModal(); commit(); toast("Copia fusionada · no se ha borrado nada");
    }catch(e){ toast("Archivo no válido","err"); }
  };
  r.readAsText(file);
}

/* ===================== TOAST ===================== */
function toast(msg,type){
  const el=document.createElement("div");
  el.className="toast"+(type==="err"?" err":"");
  el.innerHTML=`<svg viewBox="0 0 24 24">${type==="err"?'<path d="M12 8v5M12 16h.01"/><circle cx="12" cy="12" r="9"/>':'<path d="M5 13l4 4L19 7"/>'}</svg>${esc(msg)}`;
  $("#toasts").appendChild(el);
  setTimeout(()=>{ el.style.opacity="0"; el.style.transition="opacity .3s"; setTimeout(()=>el.remove(),300); },2600);
}

/* ===================== NAV / ARRANQUE ===================== */
function setView(v){
  view=v; selectedCliente = v==="clientes"?selectedCliente:selectedCliente;
  document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("active",b.dataset.view===v));
  closeMobileNav();
  render();
  $(".main").scrollTop=0;
}
document.querySelectorAll("#nav button").forEach(b=>b.addEventListener("click",()=>setView(b.dataset.view)));
$("#quick-add").addEventListener("click",()=>{
  if(view==="clientes") newCliente();
  else if(view==="agenda") newEvento();
  else newTask();
});
$("#open-config").addEventListener("click",openConfig);

/* nav móvil */
function closeMobileNav(){ $("#sidebar").classList.remove("open"); $("#scrim").classList.remove("show"); }
$("#menu-toggle").addEventListener("click",()=>{ $("#sidebar").classList.add("open"); $("#scrim").classList.add("show"); });
$("#scrim").addEventListener("click",closeMobileNav);
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeModal(); });

loadLocal();
seedIfEmpty();
render();
window.addEventListener("load",()=>{ initAuth(); });
</script>
